{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Hospital Referral System</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" type="button">Login</button>
      <button class="auth-tab" id="signupTab" type="button">Sign Up</button>
    </div>

    <div class="auth-logo">✚</div>
    <h1>Hospital Referral System</h1>

    {% if messages %}
      {% for message in messages %}
        <p class="message {% if message.tags == 'success' %}success{% endif %}">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form id="loginForm" method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <label>User Type
        <select name="user_type" required>
          <option value="admin">Admin</option>
          <option value="barangay">Barangay Health Center</option>
          <option value="district">District Hospital</option>
          <option value="batmc">Batangas Medical Center</option>
        </select>
      </label>
      <label>Username
        <input name="username" required autocomplete="username" />
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="primary-btn" type="submit">Login</button>
    </form>

    <form id="signupForm" class="hidden" method="post" action="{% url 'signup' %}">
      {% csrf_token %}
      <label>User Type
        <select name="user_type" required>
          <option value="">Select your role</option>
          <option value="admin">Admin</option>
          <option value="barangay">Barangay Health Center</option>
          <option value="district">District Hospital</option>
          <option value="batmc">Batangas Medical Center</option>
        </select>
      </label>
      <label>Username
        <input name="username" required autocomplete="username" placeholder="Choose a username" />
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="new-password" placeholder="Create a password" />
      </label>
      <button class="primary-btn" type="submit">Create Account</button>
    </form>
  </main>

  <script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      signupTab.classList.remove("active");
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      loginForm.style.display = "grid";
      signupForm.style.display = "none";
    });

    signupTab.addEventListener("click", () => {
      signupTab.classList.add("active");
      loginTab.classList.remove("active");
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      signupForm.style.display = "grid";
      loginForm.style.display = "none";
    });
    signupForm.style.display = "none";
  </script>
</body>
</html>
